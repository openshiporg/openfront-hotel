[build]
builder = "RAILPACK"
buildCommand = "keystone build --no-ui && next build"

[deploy]
# Match the canonical Openfront E-commerce/Restaurant migration-start grammar.
startCommand = "npm run migrate && next start"
# Liveness permits first-admin/property setup on a fresh database. Do not open
# public booking traffic until the stricter /api/ready endpoint returns 200.
healthcheckPath = "/api/health"
healthcheckTimeout = 300
